<!DOCTYPE html>
<html lang="ru-RU">
<head>
    <meta charset="UTF-8">
    <title>Формы</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Формы</h1>
    </header>
    <section>
    <form>
        <fieldset>
            <legend>Регистрация</legend>
        <label>Имя: <input type="text" placeholder="Введите имя"></label>
        <label>Телефон: <input type="tel" placeholder="+7 (___) ___-__-__"/></label>
        <br>
        <label>Email: <input type="email" placeholder="example@mail.com"/></label>
        <br>
        <label>Пароль: <input type="password"/></label>
        <br>
        <label>
        Поколение ЭВМ
            <select>
                <option>Первое</option>
                <option>Второе</option>
            </select>
        </label>
        <label> Комментарий <input type="url" placeholder="Текст"/></label>
        <br>
        <label>
            Число <input type="number" inputmode="numeric" disabled />
        </label>
        <br>
        </fieldset>
        <button type="submit">Отправить</button>
    </form>
    </section>
    <aside>
        <p>Пример обязательных и отключенных полей</p>
    </aside>
    </main>
    <footer>
        <a href="index.html"><-Назад</a>
    </footer>

</body>
</html>
